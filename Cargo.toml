[workspace]
members = [
  "crates/domain",
  "crates/application",
  "crates/persistence",
  "crates/infrastructure",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
argon2 = "0.5"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
sqlx = { version = "0.8", features = ["sqlite", "chrono", "uuid", "runtime-tokio", "migrate"] }
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort): a panic in a Tauri command/task must surface as a
# window error, not kill the whole desktop process (plan Phase 8).
panic = "unwind"
strip = true

[workspace.lints.clippy]
# Enable all style lints
pedantic = "warn"
