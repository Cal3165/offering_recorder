[package]
name = "offering-recorder-slint"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
offering-application = { path = "../crates/application" }
offering-domain = { path = "../crates/domain" }
offering-infrastructure = { path = "../crates/infrastructure" }
offering-persistence = { path = "../crates/persistence" }
chrono = "0.4"
dirs = "6"
serde = "1"
serde_json = "1"
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = "1"

[build-dependencies]
slint-build = "=1.19.0"
