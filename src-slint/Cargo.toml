[package]
name = "offering-recorder-slint"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata.android]
package = "com.caleb.offeringrecorder.slint"
apk_name = "offering-recorder-slint"
manifest_override = "android/AndroidManifest.xml"
java_sources = "android/java"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[package.metadata.android.application]
label = "Offering Recorder (Slint)"
[[package.metadata.android.application.activity]]
name = "com.caleb.offeringrecorder.slint.RecorderActivity"

[dependencies]
offering-application = { path = "../crates/application" }
offering-domain = { path = "../crates/domain" }
offering-infrastructure = { path = "../crates/infrastructure" }
offering-persistence = { path = "../crates/persistence" }
chrono = "0.4"
dirs = "6"
serde = "1"
serde_json = "1"
slint = { version = "=1.19.0", default-features = false, features = ["std", "accessibility", "compat-1-2"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = "1"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software"] }

[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["backend-winit", "renderer-skia"] }

[build-dependencies]
cc = "1"
slint-build = "=1.19.0"
