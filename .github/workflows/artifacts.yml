name: Build artifacts
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slint-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: offering-recorder-slint }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, binary: offering-recorder-slint.exe }
          - { runner: macos-15, target: aarch64-apple-darwin, binary: offering-recorder-slint }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, binary: offering-recorder-slint }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --locked --release --manifest-path src-slint/Cargo.toml --target ${{ matrix.target }}
      - name: Archive executable
        shell: bash
        run: tar -czf slint-${{ matrix.target }}.tar.gz -C src-slint/target/${{ matrix.target }}/release ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: slint-${{ matrix.target }}
          path: slint-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundle: deb, extension: deb }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, bundle: nsis, extension: exe }
          - { runner: macos-15, target: aarch64-apple-darwin, bundle: dmg, extension: dmg }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, bundle: dmg, extension: dmg }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --ci --config .github/tauri-artifacts.json --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error

  tauri-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: oven-sh/setup-bun@v2
      - name: Configure Android NDK
        run: |
          test -d "${ANDROID_NDK_LATEST_HOME:?Missing Android NDK}"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run tauri android init --ci --config .github/tauri-artifacts.json --skip-targets-install
      - run: bun run tauri android build --ci --config .github/tauri-artifacts.json --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  tauri-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: oven-sh/setup-bun@v2
      - run: command -v xcodegen || brew install xcodegen
      - run: bun install --frozen-lockfile
      - run: bun run tauri ios init --ci --config .github/tauri-artifacts.json --skip-targets-install
      - run: bun run tauri ios build --ci --config .github/tauri-artifacts.json --target aarch64 --no-sign --archive-only
      - name: Package Xcode archive
        run: |
          archive="$(find src-tauri/gen/apple/build -type d -name '*.xcarchive' -prune -print -quit)"
          test -n "$archive"
          ditto -c -k --keepParent "$archive" tauri-ios-arm64-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-arm64-unsigned
          path: tauri-ios-arm64-unsigned.zip
          if-no-files-found: error

  web-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: svelte-static-frontend
          path: build/
          if-no-files-found: error

  slint-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-slint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          test -d "${ANDROID_NDK_LATEST_HOME:?Missing Android NDK}"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo install --locked cargo-apk2 --version 1.5.0
      - run: cargo fetch --locked --target aarch64-linux-android
      - run: cargo apk2 build --lib --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: slint-android-arm64-debug
          path: src-slint/target/debug/apk/**/offering-recorder-slint.apk
          if-no-files-found: error

  slint-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: src-slint/ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: command -v xcodegen || brew install xcodegen
      - run: xcodegen generate
      - name: Build Apple Silicon simulator app
        run: |
          xcodebuild -project OfferingRecorderSlint.xcodeproj -scheme OfferingRecorderSlint \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/slint-ios" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          app="$RUNNER_TEMP/slint-ios/Build/Products/Release-iphonesimulator/OfferingRecorderSlint.app"
          test -x "$app/OfferingRecorderSlint"
          ditto -c -k --keepParent "$app" slint-ios-arm64-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: slint-ios-arm64-simulator
          path: src-slint/ios/slint-ios-arm64-simulator.zip
          if-no-files-found: error
